<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naija Parol</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #101827;
        --line: rgba(148, 163, 184, 0.2);
        --text: #eef4ff;
        --muted: #bfd0eb;
        --primary: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #08111f, #0d1729);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .frame {
        width: min(900px, calc(100% - 20px));
        background: rgba(18, 31, 52, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.3);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      a {
        color: var(--muted);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .btn {
        display: inline-block;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--text);
        background: transparent;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: linear-gradient(180deg, #0f172a, #111827);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <a href="../play.html">← Back to Arcade</a>
        <strong>Naija Parol</strong>
      </header>
      <canvas id="game" width="760" height="420"></canvas>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
